[package]
name = "portfolio_api"
version = "0.1.0"
edition = "2024"

[lib]
name = "portfolio_api"
path = "src/lib.rs"

[workspace]
members = [
  ".", 
  "entities", 
  "migrations",
  "factories",
  "seeders"
]

[dependencies]
entities = { path = "entities" }
migrations = { path = "migrations" }
# factories= { path = "factories" }
# seeders= { path = "seeders" }
actix-web = "4.14.0"
actix-session = { version = "0.11.0", features = ["redis-session-rustls"] }
actix-identity = "0.9.0"
actix-cors = "0.7.2"
sea-orm = {version = "2.0.0", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros" ] }
serde = {version = "1.0.228", features = ["derive"]}
serde_json = "1.0.150"
validator = { version = "0.20.0", features = ["derive"] }
actix-web-validator = "7.0.0"
argon2 = "0.6.0"
regex = "1.13.1"
env_logger = "0.11.11"
dotenv = "0.15.0"
