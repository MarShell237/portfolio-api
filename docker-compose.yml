services:
  db:
    image: postgres:18-alpine
    container_name: portfolio_db
    restart: always
    environment:
      POSTGRES_DB: portfolio_db
      POSTGRES_USER: marshell
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
